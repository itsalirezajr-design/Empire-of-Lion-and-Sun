name: Android debug APK

on:
  push:
    branches: [main, empire-rts-recovery]
    paths:
      - "project.godot"
      - "icon.svg"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Android export tools and debug signing
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/empire-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p build
          cp "$RUNNER_TEMP/empire-debug.keystore" build/debug.keystore
          cat >> export_presets.cfg <<EOF
          keystore/debug = "build/debug.keystore"
          keystore/debug_user = "androiddebugkey"
          keystore/debug_password = "android"
          EOF
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$RUNNER_TEMP/empire-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          EOF
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -x "/usr/lib/jvm/java-17-openjdk-amd64/bin/java"
          test -x "/usr/lib/android-sdk/platform-tools/adb"
          test -s "$RUNNER_TEMP/empire-debug.keystore"
          test -s build/debug.keystore
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run phase 1 and 2 gameplay tests
        run: godot --headless --path . --script res://tests/navigation_smoke.gd
      - name: Run phase 3 menu tests
        run: godot --headless --path . --script res://tests/phase3_ui_smoke.gd
      - name: Run mobile input smoke tests
        run: godot --headless --path . --script res://tests/mobile_input_smoke.gd
      - name: Run combat and win/loss smoke tests
        run: godot --headless --path . --script res://tests/combat_smoke.gd
      - name: Build Android debug APK
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/EmpireOfLionAndSun-debug.apk
          test -s build/EmpireOfLionAndSun-debug.apk
          unzip -t build/EmpireOfLionAndSun-debug.apk
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner verify --verbose build/EmpireOfLionAndSun-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EmpireOfLionAndSun-Android-debug
          path: build/EmpireOfLionAndSun-debug.apk
          if-no-files-found: error
          retention-days: 14
