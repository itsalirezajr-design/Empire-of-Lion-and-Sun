name: Godot project validation

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/godot-validation.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit
      - name: Run phase 1 and 2 gameplay smoke tests
        run: godot --headless --path . --script res://tests/navigation_smoke.gd
      - name: Run phase 3 menu smoke tests
        run: godot --headless --path . --script res://tests/phase3_ui_smoke.gd
